# JVM sizing tuned for constrained machines (2 cores / 4 GB).
# Kotlin compiles in-process inside the Gradle daemon to avoid running two big JVMs.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=832m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
