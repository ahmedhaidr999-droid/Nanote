name: Android CI

on:
  push:
    branches: [ main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK (all modules)
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest \
            :core:model:test \
            :core:storage:test \
            --continue --stacktrace

      - name: Lint (app)
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Compile instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nanote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**

  release:
    name: Release APK (R8, debug-signed without secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-test
    env:
      # Map secrets to env so the step-level `if` can test their presence
      # (the secrets context itself is not available in steps.if).
      NANOTE_KEYSTORE: ${{ secrets.NANOTE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Optional secure signing: when the NANOTE_KEYSTORE_BASE64 secret is
      # configured the release APK is signed with the real key; otherwise the
      # build falls back to the debug key (installable, NOT a store release).
      - name: Restore signing key (only when secrets are configured)
        if: env.NANOTE_KEYSTORE != ''
        run: |
          echo "${{ secrets.NANOTE_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
          printf 'storeFile=keystore/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.NANOTE_STORE_PASSWORD }}" "${{ secrets.NANOTE_KEY_ALIAS }}" "${{ secrets.NANOTE_KEY_PASSWORD }}" \
            > keystore/keystore.properties

      - name: Build release APK (R8 minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanote-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Build release AAB (bundle)
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanote-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
